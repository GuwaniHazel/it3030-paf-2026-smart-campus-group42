# ─────────────────────────────────────────────────────────────
# Smart Campus Operations Hub – Module B: Booking Management
# application.properties
# ─────────────────────────────────────────────────────────────

# Application name
spring.application.name=smart-campus-booking

# ─────────────────────────────────────────────────────────────
# MySQL Database Configuration
# Change the values below to match your local MySQL setup.
# ─────────────────────────────────────────────────────────────

# JDBC URL format: jdbc:mysql://<host>:<port>/<database_name>
spring.datasource.url=jdbc:mysql://localhost:3306/smart_campus_db

# Your MySQL username (default is 'root')
spring.datasource.username=root

# Your MySQL password (update this to your actual password)
spring.datasource.password=2003

# MySQL JDBC Driver class (automatically detected, but explicit is clearer)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────────────────────────
# JPA / Hibernate Configuration
# ─────────────────────────────────────────────────────────────

# 'update' = Hibernate will auto-update the schema without dropping data.
# Use 'create' during initial development to auto-create tables.
# Use 'validate' in production to ensure schema matches entities.
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL in the console (helpful during development/viva demo)
spring.jpa.show-sql=true

# Format the printed SQL for readability
spring.jpa.properties.hibernate.format_sql=true

# Hibernate dialect for MySQL 8+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─────────────────────────────────────────────────────────────
# Server Configuration
# ─────────────────────────────────────────────────────────────

# The port the Spring Boot app will run on (default: 8080)
server.port=8080
